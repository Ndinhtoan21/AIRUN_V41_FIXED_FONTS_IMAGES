<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIRUN API Test</title><style>body{font-family:system-ui,sans-serif;max-width:920px;margin:40px auto;padding:0 16px;color:#123}button{padding:10px 14px;border:0;border-radius:10px;background:#08664f;color:#fff;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.card{border:1px solid #d8e4de;border-radius:14px;padding:14px;background:#fff}.ok{color:#087055}.bad{color:#b42318}pre{white-space:pre-wrap;word-break:break-word;background:#f4f8f5;padding:10px;border-radius:10px;max-height:360px;overflow:auto}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body>
<h1>AIRUN · kiểm tra proxy API</h1><p>Trang này bỏ qua toàn bộ dashboard, bản đồ và GPS để chỉ kiểm tra fetch cùng tên miền.</p><button id="run">Kiểm tra lại</button><div class="grid"><section class="card"><h2>Weather</h2><p id="ws">Chưa kiểm tra</p><pre id="wj"></pre></section><section class="card"><h2>Air</h2><p id="as">Chưa kiểm tra</p><pre id="aj"></pre></section></div>
<script>
async function one(kind,url,status,out){const s=document.getElementById(status),o=document.getElementById(out);s.textContent='Đang gọi '+url;s.className='';o.textContent='';const t=performance.now();try{const r=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{throw new Error('Không phải JSON: '+raw.slice(0,120))}if(!r.ok||data.error)throw new Error('HTTP '+r.status+' '+(data.reason||''));s.textContent=`OK · ${Math.round(performance.now()-t)} ms`;s.className='ok';o.textContent=JSON.stringify(data.current||data,null,2)}catch(e){s.textContent='LỖI · '+e.message;s.className='bad';o.textContent=String(e.stack||e)}}
async function run(){await Promise.all([one('weather','/api/weather/16.0603/108.2208','ws','wj'),one('air','/api/air/16.0603/108.2208','as','aj')])}document.getElementById('run').onclick=run;run();
</script></body></html>
