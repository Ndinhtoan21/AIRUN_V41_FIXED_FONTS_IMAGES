<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="title desc">
  <title id="title">Người chạy bộ bên sông Hàn, Đà Nẵng</title>
  <desc id="desc">Minh họa vector một người chạy bộ trên cung đường ven sông, phía xa là cầu và đường chân trời Đà Nẵng.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8f0df"/>
      <stop offset=".55" stop-color="#dff8e7"/>
      <stop offset="1" stop-color="#f9f0d1"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58bcae"/>
      <stop offset="1" stop-color="#1a7e73"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25473f"/>
      <stop offset="1" stop-color="#17372f"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8b5"/>
      <stop offset="1" stop-color="#d9ef86" stop-opacity=".2"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#053f34" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="920" height="620" rx="44" fill="url(#sky)"/>
  <circle cx="735" cy="116" r="78" fill="url(#sun)"/>
  <circle cx="735" cy="116" r="37" fill="#f3e77b" opacity=".9"/>

